name: Check Government Support Programs

on:
  schedule:
    - cron: "0 0 * * *"  # 매일 09:00 KST(=UTC 00:00)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create config.py
        run: |
          cat > config.py <<EOF
          import json
          COMPANY_PROFILE = json.loads(r"""${{ secrets.COMPANY_PROFILE_JSON }}""")
          BIZINFO_API_KEY = "${{ secrets.BIZINFO_API_KEY }}"
          KSTARTUP_API_KEY = "${{ secrets.KSTARTUP_API_KEY }}"
          SLACK_WEBHOOK_URL = "${{ secrets.SLACK_WEBHOOK_URL }}"
          SEEN_ANNOUNCEMENTS_FILE = "seen_announcements.json"
          EOF

      - name: Run collector
        run: python3 main.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs seen_announcements.json
          git diff --cached --quiet || git commit -m "공고 데이터 업데이트 $(date +'%Y-%m-%d')"
          git push
